; World Open Research Journal: dedicated PHP-FPM pool (installed as /etc/php/8.3/fpm/pool.d/worj.conf)
; Sized for a 4 GB VPS that also runs MariaDB (about 1 GB buffer pool) and Nginx:
; 12 workers at up to 256 MB would be the worst case; typical OJS requests use far less.
[worj]
user = www-data
group = www-data
listen = /run/php/worj-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.3-fpm-worj-slow.log

; keep the process environment clean: the pool must not see the operator's or the installer's variables
clear_env = yes
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.3-fpm-worj.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
; open_basedir is NOT set yet: it is added only after the Nginx harness shows the whole site works under it (Phase 5 commit 6).
